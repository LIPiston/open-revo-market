<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>锁定充电上限</title>
  <style>
    :root {
      --surface-overlay: rgba(255, 255, 255, 0.04);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.16);
      --status-ok: #10b981;
      --status-ok-dim: rgba(16, 185, 129, 0.12);
      --text-primary: #f8fafc;
      --text-dim: #94a3b8;
      --radius-md: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      height: 100vh;
    }

    .sleep-office-mode-card {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--surface-overlay);
      border: 1px solid var(--border-subtle);
      padding: 5px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease-out;
      width: 100%;
      height: 36px;
    }

    .sleep-office-mode-card:hover {
      border-color: var(--border-medium);
    }

    .sleep-office-mode-card.active {
      background: var(--status-ok-dim);
      border-color: var(--status-ok);
    }

    .info-container {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .card-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      line-height: 1.25;
      transition: color 0.15s ease-out;
    }

    .sleep-office-mode-card.active .card-title {
      color: var(--status-ok);
    }

    .rev-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      line-height: 1;
    }

    .card-subtitle {
      font-size: 9.5px;
      color: var(--text-dim);
      white-space: nowrap;
      line-height: 1.25;
    }

    /* RevSwitch mini replica */
    .switch-track {
      width: 28px;
      height: 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.12);
      position: relative;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .switch-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    .sleep-office-mode-card.active .switch-track {
      background: var(--status-ok);
    }

    .sleep-office-mode-card.active .switch-thumb {
      transform: translateX(12px);
    }
  </style>
</head>
<body>
  <div
    id="card"
    class="sleep-office-mode-card"
    title="实验性功能：激活底层 EC 平台门控以真正生效 60%/80% 限电，如遇异常可随时关闭。"
    onclick="toggleHardwareLimit()"
  >
    <div class="info-container">
      <div class="title-row">
        <span class="card-title">锁定充电上限</span>
        <span class="rev-badge">实验</span>
      </div>
      <div class="card-subtitle">激活 EC 平台门控以真实生效限电</div>
    </div>
    <div class="switch-track">
      <div class="switch-thumb"></div>
    </div>
  </div>

  <script>
    let isEnabled = false;
    let isLoading = false;

    // Resolve Tauri invoke
    function getInvoke() {
      if (window.__TAURI__ && window.__TAURI__.core && typeof window.__TAURI__.core.invoke === 'function') {
        return window.__TAURI__.core.invoke;
      }
      if (window.parent && window.parent.__OPENREVO_BRIDGE__ && typeof window.parent.__OPENREVO_BRIDGE__.invoke === 'function') {
        return window.parent.__OPENREVO_BRIDGE__.invoke;
      }
      return null;
    }

    async function syncStatus() {
      const inv = getInvoke();
      if (!inv) return;
      try {
        const info = await inv('get_power_settings');
        if (info && typeof info.battery_hardware_limit_enabled === 'boolean') {
          isEnabled = info.battery_hardware_limit_enabled;
          updateView();
        }
      } catch (e) {
        console.warn('Failed to query power settings:', e);
      }
    }

    function updateView() {
      const card = document.getElementById('card');
      if (card) {
        card.classList.toggle('active', isEnabled);
      }
    }

    async function toggleHardwareLimit() {
      if (isLoading) return;
      isLoading = true;
      const nextVal = !isEnabled;
      isEnabled = nextVal;
      updateView();

      const inv = getInvoke();
      if (inv) {
        try {
          await inv('set_battery_hardware_limit', { enable: nextVal });
        } catch (err) {
          console.error('Failed to set battery hardware limit:', err);
          isEnabled = !nextVal;
          updateView();
        }
      }
      isLoading = false;
    }

    // Initialize on ready
    window.addEventListener('DOMContentLoaded', () => {
      syncStatus();
    });
    // In case bridge mounts slightly later
    setTimeout(syncStatus, 150);
  </script>
</body>
</html>
