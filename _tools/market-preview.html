<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>OpenRevo 插件市场 · 预览（复刻宿主 srcdoc 注入）</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b0e14; color: #f8fafc;
    font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }
  /* 复刻宿主 .openrevo-shell 的观感，让截图接近真实上下文 */
  .frame { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .chrome { flex-shrink: 0; padding: 8px 14px; background: #00000040; border-bottom: 1px solid #ffffff14;
    font-size: 11px; color: #94a3b8; display: flex; gap: 10px; align-items: center; }
  .chrome b { color: #f8fafc; font-weight: 600; }
  .chrome .tag { padding: 1px 7px; border-radius: 9999px; background: #38bdf826; color: #7dd3fc;
    border: 1px solid #38bdf84d; font-size: 9.5px; font-weight: 600; }
  .vp { flex: 1 1 0%; min-height: 0; padding: 16px; overflow: hidden; box-sizing: border-box; }
  iframe { width: 100%; height: 100%; border: none; background: transparent; display: block; }
  #diag { position: fixed; right: 8px; bottom: 8px; z-index: 99; max-width: 46vw; padding: 8px 10px;
    background: #0f172ae6; border: 1px solid #ffffff26; border-radius: 8px; font: 10px/1.5 Consolas, monospace;
    color: #94a3b8; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  #diag.err { border-color: #ef4444; color: #fecaca; }
  #diag.ok { border-color: #10b981; color: #a7f3d0; }
</style>
</head>
<body>
<div class="frame">
  <div class="chrome"><b>OPENREVO</b><span class="tag">面板插槽</span><span>插件市场 · 预览</span>
    <span style="margin-left:auto" id="themes"></span></div>
  <div class="vp"><iframe id="f" sandbox="allow-scripts allow-forms allow-same-origin"></iframe></div>
</div>
<pre id="diag">booting…</pre>
<script>
/* ============================================================================
 * 预览宿主：复刻 v0.9.1 真实宿主对 tab 插件的处理方式
 *   - iframe 的 sandbox 逐字照抄：allow-scripts allow-forms allow-same-origin
 *   - 用 srcdoc 注入插件 index.html（宿主走 load_plugin_html 后 srcDoc 注入）
 *   - 父窗口挂 __TAURI_INTERNALS__，模拟 Tauri 桥，供插件调用只读命令
 * 目的：在真实宿主里发现问题前，先在等价环境里跑出 JS 错误与渲染结果。
 * ========================================================================== */
const params = new URLSearchParams(location.search);
const THEME = params.get('theme') || 'cyber';
// ?nodiag=1 隐藏诊断浮层，供人眼/像素检查版式（验收脚本仍走带浮层的那条路）
const SHOW_DIAG = params.get('nodiag') !== '1';
document.documentElement.setAttribute('data-theme', THEME);
if (!SHOW_DIAG) {
  const d0 = document.getElementById('diag');
  if (d0) d0.style.display = 'none';
}

const CALLS = [];
// 宿主安装器拒绝过的调用（参数不合法）。验收必须把它当成失败 ——
// 市场自己 catch 了异常只弹 toast，不产生未捕获错误，光看 errors 是发现不了的。
const MOCK_ERRORS = [];
const INSTALL_ARGS = [];
const UNINSTALL_ARGS = [];
// ?host=old 模拟没有安装接口的宿主：get_plugin_host_capabilities 直接 reject。
// 默认模拟能力齐全的宿主：安装/卸载/重载都返回成功。
const HOST_MODE = params.get('host') || 'new';
const INSTALLED = [
  { id: 'plugin-market', plugin_type: 'tab', enabled: true },
];

/** 从 codeload 地址推出解压后的归档根目录名：`<repo>-<branch>`（`/` 换成 `-`）。
 *  https://codeload.github.com/owner/repo/zip/refs/heads/feat/x → repo-feat-x */
function archiveRootOf(url) {
  const m = /codeload\.github\.com\/([^/]+)\/([^/]+)\/zip\/refs\/heads\/(.+)$/.exec(String(url));
  if (!m) return null;
  return m[2] + '-' + decodeURIComponent(m[3]).replace(/\//g, '-');
}

/** 复刻真宿主「resolved content directory」的解析：extracted/<subpath>。
 *  关键点 —— 宿主**不剥** codeload 的归档包装目录，subpath 必须自己带上它。 */
function resolvedContentDir(a) {
  const root = archiveRootOf(a.url);
  if (!root) return null;
  const sub = String(a.subpath || '').replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
  // 没传 subpath 时宿主用 extracted/ 本身（这种情况未实测，先不判死）
  if (!sub) return { dir: '', root, ok: true };
  if (sub !== root && !sub.startsWith(root + '/')) return null;
  return { dir: sub, root, ok: true };
}

window.__TAURI_INTERNALS__ = {
  invoke: async (cmd, args) => {
    CALLS.push([cmd, args]);
    if (cmd === 'get_plugin_host_capabilities') {
      if (HOST_MODE === 'old') throw new Error('command get_plugin_host_capabilities not found');
      return {
        host_version: '0.10.0', tauri_version: '2.0.0',
        can_install: true, can_uninstall: true, can_reload: true,
        can_open_url: true, can_write_clipboard: true,
        can_read_manifest: true, can_manage_service: true,
      };
    }
    if (cmd === 'get_custom_plugins') return INSTALLED;
    if (cmd === 'reload_plugins') return INSTALLED;
    if (cmd === 'open_plugins_dir') return 'opened';
    // 复刻真宿主的 serde 校验：install_plugin_from_url 的必需字段是 { id, url }。
    // 必需字段以宿主 serde 为准：缺 id 时宿主直接回
    //   invalid args `id` for command `install_plugin_from_url`: missing required key id
    // 只传 url 就成功返回，等于把真实故障藏起来 —— mock 必须比真宿主更挑，不能更松。
    if (cmd === 'install_plugin_from_url') {
      const a = args || {};
      INSTALL_ARGS.push(a);
      const missing = ['id', 'url'].filter((k) => !a[k]);
      if (missing.length) {
        MOCK_ERRORS.push('missing required key ' + missing[0]);
        throw new Error(
          'invalid args `' + missing[0] + '` for command `install_plugin_from_url`: ' +
          'command install_plugin_from_url missing required key ' + missing[0]
        );
      }
      if (!/^https:\/\//.test(String(a.url))) {
        MOCK_ERRORS.push('url not https: ' + String(a.url).slice(0, 40));
        throw new Error('Security violation: Plugin download URL must strictly use HTTPS');
      }
      if (/[\\/]|\.\./.test(String(a.id))) {
        MOCK_ERRORS.push('bad plugin id: ' + a.id);
        throw new Error('Security violation: Plugin ID contains illegal characters or path separators');
      }
      if (a.subpath && /\.\./.test(String(a.subpath))) {
        MOCK_ERRORS.push('subpath traversal: ' + a.subpath);
        throw new Error('Security violation: subpath cannot contain \'..\'');
      }
      // 复刻真宿主的**归档目录解析**：codeload 的 zip 解压后固定多一层
      // `<repo>-<branch>/`，宿主把 subpath 直接拼在 extracted/ 后面，**不会剥这层**。
      // 若传仓库内路径（plugin-market），宿主会去找 extracted\plugin-market，
      // 真机上就是 manifest.json not found in resolved content directory。
      // mock 必须复现这条，否则「参数对了但布局错了」永远验不出来。
      const dir = resolvedContentDir(a);
      if (!dir) {
        MOCK_ERRORS.push('subpath 未落在归档根目录内: ' + a.subpath);
        throw new Error('manifest.json not found in resolved content directory: ' +
          'C:\\Users\\x\\AppData\\Roaming\\OpenRevo\\plugins\\.tmp_install_' + a.id +
          '\\extracted\\' + String(a.subpath || '').replace(/\//g, '\\'));
      }
      return { id: a.id, name: a.id, installed: true, dir };
    }
    if (cmd === 'uninstall_plugin') {
      const a = args || {};
      // 真机实测：uninstall_plugin 的必需字段也是 id。
      //   invalid args `id` for command `uninstall_plugin`: missing required key id
      // pluginId 只出现在 open_custom_widget 旁边，不是这一族的字段。
      if (!a.id && a.pluginId) {
        MOCK_ERRORS.push('uninstall_plugin 用了 pluginId（宿主字段是 id）');
        throw new Error('invalid args `pluginId` for command `uninstall_plugin`: ' +
          'unknown field `pluginId`, expected `id`');
      }
      if (!a.id) {
        MOCK_ERRORS.push('missing required key id');
        throw new Error('invalid args `id` for command `uninstall_plugin`: ' +
          'command uninstall_plugin missing required key id');
      }
      UNINSTALL_ARGS.push(a);
      return true;
    }
    if (cmd === 'get_plugin_manifest') {
      const a = args || {};
      if (!a.id && !a.pluginId) {
        MOCK_ERRORS.push('get_plugin_manifest 缺 id');
        throw new Error('invalid args `id` for command `get_plugin_manifest`: ' +
          'command get_plugin_manifest missing required key id');
      }
      return { id: a.id || a.pluginId, version: '1.1.0' };
    }
    if (cmd === 'write_clipboard' || cmd === 'open_external_url') return true;
    return { ok: true, cmd };
  },
};
window.__OPENREVO_BRIDGE__ = { invoke: window.__TAURI_INTERNALS__.invoke };

// 安装/卸载前都会 confirm，headless 里没法点 —— 预览放行但记下来，
// 好让验收脚本确认「确认闸真的走过」，而不是被绕开。
window.__CONFIRMS__ = [];
window.confirm = (msg) => { window.__CONFIRMS__.push(String(msg).slice(0, 60)); return true; };

const diag = document.getElementById('diag');
const errors = [];

// 抓父窗口能看到的子窗口错误（同源，可直接读）
const f = document.getElementById('f');

async function run() {
  let html;
  try {
    const r = await fetch('../plugin-market/index.html?t=' + Date.now());
    html = await r.text();
  } catch (e) {
    diag.className = 'err'; diag.textContent = '无法读取 plugin-market/index.html：' + e.message;
    return;
  }
  // ?catalog=local：把产物里的两个在线目录 URL 直接改写成仓库内的相对路径。
  // 否则验收结果取决于远端分支状态 —— 本地改了目录但还没 push 时，测到的仍是旧目录，
  // 「目录整个拉丢了」与「目录真的变了」也分不开。
  // 改写字面量而不是劫持 window.fetch：沙盒里 fetch 在脚本执行前就被市场模块捕获，
  // 事后替换常常不生效（实测踩过）。
  if (params.get('catalog') === 'local') {
    // catalogPath 可覆盖目录文件，用于验收「条目多到要翻页」的场景
    const catPath = params.get('catalogPath') || '../market/catalog.json';
    html = html
      .replaceAll('https://raw.githubusercontent.com/LIPiston/open-revo-market/main/market/catalog.json',
                  catPath)
      .replaceAll('https://gh-proxy.com/https://raw.githubusercontent.com/LIPiston/open-revo-market/main/market/catalog.json',
                  catPath)
      .replaceAll('https://cdn.jsdelivr.net/gh/LIPiston/open-revo-market@main/market/catalog.json',
                  catPath);
  }
  f.srcdoc = html;

  // 装好错误钩子（子窗口与父窗口同源，可直接读写）
  f.addEventListener('load', () => {
    const w = f.contentWindow;
    try {
      w.addEventListener('error', (ev) => errors.push('error: ' + (ev.message || ev.type)));
      w.addEventListener('unhandledrejection', (ev) => errors.push('rejection: ' + String(ev.reason && ev.reason.message || ev.reason)));
    } catch (e) { errors.push('hook fail: ' + e.message); }
  });
}

function snapshot() {
  const w = f.contentWindow;
  if (!w || !w.document) return { ready: false };
  const d = w.document;
  const app = d.getElementById('app');
  const cards = d.querySelectorAll('.mkt-card');
  const toast = d.getElementById('toast');
  return {
    ready: !!(app && app.children.length),
    theme: d.documentElement.getAttribute('data-theme'),
    parentTheme: (function(){ try { return w.parent.document.documentElement.getAttribute('data-theme'); } catch(e){ return 'ERR:'+e.message; } })(),
    // 取第一枚「类型徽标」（type-<plugin_type>），不写死 skin ——
    // 目录里没有皮肤条目时写死 .type-skin 会取到 null，让主题断言恒真。
    badgeColor: (function(){ const b=d.querySelector('.mkt-badge[class*="type-"]'); return b? getComputedStyle(b).color : null; })(),
    badgeBg: (function(){ const b=d.querySelector('.mkt-badge[class*="type-"]'); return b? getComputedStyle(b).backgroundColor : null; })(),
    appChildren: app ? app.children.length : 0,
    cards: cards.length,
    sources: d.querySelectorAll('.mkt-src').length,
    badges: d.querySelectorAll('.mkt-badge').length,
    installedBadges: d.querySelectorAll('.mkt-badge.ok').length,
    unreviewed: d.querySelectorAll('.mkt-badge.warn').length,
    filterLabels: Array.from(d.querySelectorAll('.mkt-src')).map((b) => b.textContent.trim()).join(' | '),
    firstCard: (d.querySelector('.mkt-card-name') || {}).textContent || null,
    meta: (d.querySelector('.mkt-meta') || {}).textContent || null,
    footer: (d.querySelector('.mkt-footer') || {}).textContent || null,
    toast: toast ? toast.textContent : null,
    // 滚动条：容器必须真的能滚（scrollHeight > clientHeight），且外层没有撑成 auto。
    // #app 若缺 height，.mkt 会退化成 auto，overflow:auto 永不触发 —— 插件少时看不出来。
    scroll: (function () {
      const b = d.querySelector('.mkt-body');
      if (!b) return null;
      return {
        can: b.scrollHeight > b.clientHeight,
        h: b.clientHeight, sh: b.scrollHeight,
        overflow: getComputedStyle(b).overflowY,
      };
    })(),
    // 翻页：页数、当前页、页码按钮、总量与区间
    pager: (function () {
      const p = d.querySelector('.mkt-pager');
      if (!p) return null;
      const btns = Array.from(p.querySelectorAll('[data-page]'))
        .map((b) => Number(b.getAttribute('data-page')))
        .filter((n) => !Number.isNaN(n));
      const active = p.querySelector('.pg.active');
      return {
        pages: btns.length ? Math.max(...btns) : 0,
        current: active ? Number(active.getAttribute('data-page')) : null,
        pageSize: (d.querySelector('.pg-info') || {}).textContent || null,
      };
    })(),
  };
}

// 主题切换按钮（仅预览用）
document.getElementById('themes').innerHTML =
  ['cyber', 'mono', 'light'].map((t) =>
    `<button data-t="${t}" style="margin-left:4px;padding:2px 8px;font:inherit;border-radius:6px;
     border:1px solid #ffffff26;background:#ffffff0d;color:inherit;cursor:pointer">${t}</button>`).join('');
document.getElementById('themes').addEventListener('click', (e) => {
  const t = e.target.getAttribute('data-t');
  if (!t) return;
  document.documentElement.setAttribute('data-theme', t);
  try { f.contentWindow.document.documentElement.setAttribute('data-theme', t); } catch (_) {}
});

run();

// 供外部（截图脚本 / CDP）取用的探针
window.__PROBE__ = () => ({
  ready: snapshot().ready,
  errors,
  calls: CALLS.map((c) => c[0]),
  snap: snapshot(),
});

/* 额外演练：点【安装】。宿主能力不同，走的路径不同，两条都要跑：
 *   new  → 弹确认窗，点【立即安装】后真正发 install_plugin_from_url
 *   old  → 弹同一张窗，但给的是可粘贴的 PowerShell 命令
 * 注意：tab iframe 的 sandbox 没有 allow-modals，所以市场**不能**用 window.confirm ——
 * 验收必须验证这一点，否则真实宿主里会出现「点了没反应」。 */
async function exerciseInstall() {
  const w = f.contentWindow;
  const d = w.document;
  const btn = d.querySelector('[data-act="install"]');
  if (!btn) return { install: 'no install button' };

  const mode = HOST_MODE === 'old' ? 'legacy' : 'oneclick';
  btn.click();
  const scrim = d.querySelector('.mkt-scrim');
  if (!scrim) return { install: 'click did not open modal', mode };

  if (mode === 'legacy') {
    const cmdEl = scrim.querySelector('#cmd');
    return {
      install: 'modal-open', mode,
      hasCmd: !!(cmdEl && cmdEl.textContent.includes('plugins')),
      cmdHead: cmdEl ? cmdEl.textContent.slice(0, 110) : null,
      discItems: scrim.querySelectorAll('.mkt-disc-item').length,
      footBtns: Array.from(scrim.querySelectorAll('[data-act2]')).map((b) => b.getAttribute('data-act2')),
      steps: scrim.querySelectorAll('.mkt-step').length,
    };
  }

  // oneclick：点【立即安装】，确认真的发出 IPC
  const before = CALLS.length;
  const go = scrim.querySelector('[data-act2="install-now"]');
  if (!go) return { install: 'no install-now button', mode };

  // ?proxy=1：先把弹窗里的加速开关打开，验证勾选后 url 真的换成加速地址。
  // 默认不勾 —— 那一轮验的是直连地址，两条链路都要有断言，不能只测一条。
  const proxyBox = scrim.querySelector('[data-opt="proxy"]');
  if (params.get('proxy') === '1' && proxyBox) {
    proxyBox.checked = true;
    proxyBox.dispatchEvent(new w.Event('change', { bubbles: true }));
  }

  go.click();
  await new Promise((r) => setTimeout(r, 600));
  const callsSince = CALLS.slice(before).map((c) => c[0]);
  // 弹窗还在 = installEntry 抛了（市场自己 catch 后只弹 toast）⇒ 必须当失败报出来
  const stillOpen = !!d.querySelector('.mkt-scrim');
  const toastEl = d.getElementById('toast');
  return {
    install: 'confirmed', mode,
    invoked: callsSince.includes('install_plugin_from_url'),
    reloaded: callsSince.includes('reload_plugins'),
    stillOpen,
    toast: toastEl ? toastEl.textContent.slice(0, 120) : null,
    args: INSTALL_ARGS.length ? INSTALL_ARGS[INSTALL_ARGS.length - 1] : null,
    // 宿主解析出的「content directory」—— 真机报错就出在这一步
    dir: (INSTALL_ARGS.length ? resolvedContentDir(INSTALL_ARGS[INSTALL_ARGS.length - 1]) : null),
    mockErrors: MOCK_ERRORS.slice(),
    // 沙盒里 window.confirm 会被拦并返回 false —— 市场不该依赖它
    usedNativeConfirm: window.__CONFIRMS__.length > 0,
  };
}

/** 翻页演练：点下一页 → 页码/条目/滚动位置都要跟着变。
 *  只断言「有翻页条」是不够的：按钮存在但点不动，或翻页后仍停在上一页的滚动位置，
 *  用户看到的就是「点了没反应」。 */
async function exercisePaging() {
  const w = f.contentWindow;
  const d = w.document;
  const pager = d.querySelector('.mkt-pager');
  if (!pager) return { paging: 'no pager' };

  const active = () => {
    const a = d.querySelector('.pg.active');
    return a ? Number(a.getAttribute('data-page')) : null;
  };
  const cards = () => d.querySelectorAll('.mkt-card').length;
  const info = () => (d.querySelector('.pg-info') || {}).textContent || null;

  const startPage = active();
  const startCards = cards();
  const next = Array.from(pager.querySelectorAll('[data-page]'))
    .find((b) => Number(b.getAttribute('data-page')) === (startPage || 0) + 1);
  if (!next) return { paging: 'no next button', startPage };

  const body = d.querySelector('.mkt-body');
  if (body) body.scrollTop = 9999;
  const scrolledBefore = body ? body.scrollTop : null;

  next.click();
  await new Promise((r) => setTimeout(r, 400));

  const body2 = d.querySelector('.mkt-body');
  return {
    paging: 'clicked',
    startPage, endPage: active(),
    startCards, endCards: cards(),
    info: info(),
    // 翻页后必须回到顶部，否则用户会落在新一页的中间
    topAfter: body2 ? body2.scrollTop : null,
    scrolledBefore,
  };
}

/** 卸载也演练一次：确认走 uninstall_plugin、字段名是 id、且弹窗正常关闭。 */
async function exerciseUninstall() {
  const w = f.contentWindow;
  const d = w.document;
  const btn = d.querySelector('[data-act="uninstall"]');
  if (!btn) return { uninstall: 'no button' };
  if (btn.disabled) return { uninstall: 'disabled', mode: HOST_MODE };

  btn.click();
  const scrim = d.querySelector('.mkt-scrim');
  if (!scrim) return { uninstall: 'no modal' };
  const go = scrim.querySelector('[data-act2="uninstall-now"]');
  if (!go) return { uninstall: 'no confirm button' };

  const before = CALLS.length;
  const errBefore = MOCK_ERRORS.length;
  go.click();
  await new Promise((r) => setTimeout(r, 600));
  const calls = CALLS.slice(before).filter((c) => c[0] === 'uninstall_plugin');
  const toastEl = d.getElementById('toast');
  return {
    uninstall: calls.length ? 'invoked' : 'not-invoked',
    // 字段名必须是 id —— 传 pluginId 时宿主报 missing required key id
    args: calls.length ? (calls[0][1] || null) : null,
    // 弹窗还在 = uninstallEntry 抛了（market 自己 catch 后只弹 toast）
    stillOpen: !!d.querySelector('.mkt-scrim'),
    toast: toastEl ? toastEl.textContent.slice(0, 120) : null,
    mockErrors: MOCK_ERRORS.slice(errBefore),
  };
}

// ?modal=1：自动打开安装弹窗，供出图
if (params.get('modal') === '1') {
  setTimeout(() => { try { exerciseInstall(); } catch (_) {} }, 2600);
}

/* 再演练：点一次「实时发现」（打 api.github.com）。
 * 无网络 / 被限速 / 有结果 三种结局都算通过 —— 市场必须能优雅降级，
 * 但不能出现未捕获异常。失败时应在页面上给出可见的说明条。 */
async function exerciseLive() {
  const w = f.contentWindow;
  const d = w.document;
  const btn = d.querySelector('[data-act="live"]');
  if (!btn) return { live: 'no live button' };
  btn.click();
  await new Promise((r) => setTimeout(r, 3500));
  const note = d.querySelector('.mkt-note');
  return {
    live: 'clicked',
    noteText: note ? note.textContent.replace(/\s+/g, ' ').trim().slice(0, 110) : null,
  };
}

setTimeout(async () => {
  const s = snapshot();
  let install = null;
  try { install = await exerciseInstall(); } catch (e) { install = { install: 'threw: ' + e.message }; }
  let uninst = null;
  try { uninst = await exerciseUninstall(); } catch (e) { uninst = { uninstall: 'threw: ' + e.message }; }
  let live = null;
  try { live = await exerciseLive(); } catch (e) { live = { live: 'threw: ' + e.message }; }
  // 翻页演练放在最后：它会切页，会影响前面截图的卡片计数
  let paging = null;
  try { paging = await exercisePaging(); } catch (e) { paging = { paging: 'threw: ' + e.message }; }

  // 主题判定：mono 下类型徽标必须去饱和（宿主 mono 是整套灰阶）。
  // 选 type-* 而不是 type-skin：皮肤条目删掉后写死 skin 会取到 null，断言就白写了。
  const w = f.contentWindow;
  const bd = w.document.querySelector('.mkt-badge[class*="type-"]');
  const rgb = bd ? getComputedStyle(bd).color.match(/\d+/g).map(Number) : null;
  const sat = rgb ? (Math.max(...rgb) - Math.min(...rgb)) / Math.max(...rgb) : null;
  // 取不到就是没测到 —— 不能当成通过。
  // cyber 下只要求「确实取到了徽标」（颜色不做阈值），mono 下还要求去饱和。
  const themeOk = bd !== null && (THEME === 'mono' ? (sat !== null && sat < 0.12) : true);

  // 两条宿主路径的成功判据不同，但都必须成立：
  //   oneclick → 弹确认窗 → 点【立即安装】→ 真发 install_plugin_from_url（并重扫）
  //   legacy   → 弹窗并给出含 plugins 路径的可粘贴命令
  // 两条都不许依赖 window.confirm：沙盒没有 allow-modals，原生确认框会静默返回 false。
  // oneclick 还要求：宿主没拒参数（mockErrors 空）、弹窗已关闭（installEntry 没抛）、
  // 且参数里确实带了 id（真机就是缺它失败过一次）。
  const installOk = install && (
    (install.mode === 'oneclick'
      && install.install === 'confirmed'
      && install.invoked
      && install.usedNativeConfirm === false
      && install.stillOpen === false
      && (install.mockErrors || []).length === 0
      && install.args && install.args.id && install.args.url)
    || (install.mode === 'legacy' && install.install === 'modal-open' && install.hasCmd)
  );

  const ok = s.ready && s.cards > 0 && errors.length === 0
    && installOk && themeOk && live && live.live === 'clicked';

  diag.className = ok ? 'ok' : 'err';
  diag.textContent = JSON.stringify({
    host: HOST_MODE, ready: s.ready, cards: s.cards, errors, install, uninstall: uninst, live, paging,
    scroll: s.scroll, pager: s.pager,
    calls: [...new Set(CALLS.map(c => c[0]))], sources: s.sources, badges: s.badges,
    installedBadges: s.installedBadges, filterLabels: s.filterLabels,
    meta: (s.meta || '').replace(/\s+/g, ' ').trim(),
    theme: s.theme, parentTheme: s.parentTheme, badgeColor: s.badgeColor,
    badgeSat: sat === null ? null : Number(sat.toFixed(3)), themeOk,
  }, null, 1);
  document.title = ok ? 'PREVIEW_OK' : 'PREVIEW_FAIL';
}, 3200);
</script>
</body>
</html>
